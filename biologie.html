const SCHEMA=2, STORAGE_KEY='pflanzen-entdecker-pruefungsstoff-v2';
const isSelfAssessed=q=>q.type==='written'||q.type==='trace';
const fresh=()=>({version:SCHEMA,answers:{},read:[],lastLesson:null,exam:{answers:{},started:null,finished:false},updated:null});
function cleanTrace(value){
 const v=value&&typeof value==='object'?value:{};
 const strokes=Array.isArray(v.strokes)?v.strokes.slice(0,40).map(s=>Array.isArray(s)?s.slice(0,1200).filter(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)&&p[0]>=0&&p[0]<=720&&p[1]>=0&&p[1]<=450).map(p=>[p[0],p[1]]):[]).filter(s=>s.length>=2):[];
 const route=Array.isArray(v.route)&&v.route.length===5?v.route.map(x=>Number.isInteger(x)&&x>=0&&x<5?x:null):Array(5).fill(null);
 return{strokes,route};
}
function validateState(s,questions,lessons){
 if(!s||typeof s!=='object'||s.version!==SCHEMA||!s.answers||typeof s.answers!=='object'||Array.isArray(s.answers))throw Error('Diese Sicherung gehört nicht zur gezielten Prüfungsfassung (Version 2).');
 const result=fresh();
 function cleanAnswers(src,qs){
  const out={};if(!src||typeof src!=='object'||Array.isArray(src))return out;
  for(const q of qs){const a=src[q.id];if(!a||typeof a!=='object')continue;const x={};
   if(q.type==='written'){if(typeof a.value==='string')x.value=a.value.slice(0,12000);}
   else if(q.type==='trace')x.value=cleanTrace(a.value);
   else if(q.type==='choice'){if(Number.isInteger(a.value)&&a.value>=0&&a.value<q.options.length)x.value=a.value;}
   else if(q.type==='match'||q.type==='label'){if(Array.isArray(a.value)&&a.value.length===q.labels.length)x.value=a.value.map(v=>Number.isInteger(v)&&v>=0&&v<q.options.length?v:null);}
   else if(q.type==='order'){if(Array.isArray(a.value)&&a.value.length===q.items.length&&new Set(a.value).size===q.items.length&&a.value.every(v=>Number.isInteger(v)&&v>=0&&v<q.items.length))x.value=a.value;}
   if(x.value===undefined)continue;x.checked=a.checked===true;
   if(isSelfAssessed(q)){x.modelShown=a.modelShown===true;if(x.checked&&x.modelShown&&(complete(q,x.value)||a.score===0)&&Number.isInteger(a.score)&&a.score>=0&&a.score<=q.points)x.score=a.score;else x.checked=false;}
   else if(x.checked)x.score=grade(q,x.value);out[q.id]=x;
  }return out;
 }
 result.answers=cleanAnswers(s.answers,questions.filter(q=>!q.id.startsWith('e')));
 result.read=Array.isArray(s.read)?[...new Set(s.read.filter(id=>lessons.some(l=>l.id===id)))]:[];
 result.lastLesson=lessons.some(l=>l.id===s.lastLesson)?s.lastLesson:null;
 const ex=s.exam||{};result.exam={answers:cleanAnswers(ex.answers,questions.filter(q=>q.id.startsWith('e'))),started:typeof ex.started==='number'&&Number.isFinite(ex.started)?ex.started:null,finished:ex.finished===true};
 result.updated=typeof s.updated==='string'?s.updated:null;return result;
}
function grade(q,value){
 if(q.type==='choice')return value===q.answer?q.points:0;
 if(q.type==='match'||q.type==='label')return Math.round(q.answer.reduce((n,v,i)=>n+(value?.[i]===v?1:0),0)/q.answer.length*q.points*100)/100;
 if(q.type==='order')return q.answer.every((v,i)=>value?.[i]===v)?q.points:0;
 return null;
}
function complete(q,value){
 if(q.type==='written')return typeof value==='string'&&value.trim().length>0;
 if(q.type==='trace'){const v=cleanTrace(value);return v.strokes.some(s=>s.length>=2)||v.route.every(Number.isInteger);}
 if(q.type==='choice')return Number.isInteger(value)&&value>=0&&value<q.options.length;
 if(q.type==='match'||q.type==='label')return Array.isArray(value)&&value.length===q.labels.length&&value.every(v=>Number.isInteger(v)&&v>=0&&v<q.options.length);
 if(q.type==='order')return Array.isArray(value)&&value.length===q.items.length;return false;
}
function lessonProgress(lesson,answers){const done=lesson.questions.filter(q=>answers[q.id]?.checked).length;return{done,total:lesson.questions.length,percent:Math.round(done/lesson.questions.length*100)};}
function examSummary(questions,answers){let score=0,graded=0,pending=0;for(const q of questions){const a=answers[q.id];if(a?.checked&&typeof a.score==='number'){score+=a.score;graded+=q.points;}else pending+=q.points;}return{score,graded,pending,total:questions.reduce((n,q)=>n+q.points,0)};}

 const answered=exam.filter(q=>complete(q,answer(q,true).value)).length;return `${bread([['Probeklausur','#/exam'],[state.exam.finished?'Antworten vergleichen':'Aufgaben bearbeiten']])}<div class="exam-head"><div><strong>${state.exam.finished?'🔍 Deine Auswertung':'✏️ Probeklausur'}</strong><small>${state.exam.finished?`${summary.score} Punkte bisher bewertet`:`${answered} / ${exam.length} Aufgaben beantwortet`}</small></div><nav class="exam-nav" aria-label="Prüfungsaufgaben">${exam.map((q,i)=>`<button class="${i===step?'active':''} ${complete(q,answer(q,true).value)?'answered':''}" data-action="exam-step" data-step="${i}" aria-label="Aufgabe ${i+1}" ${i===step?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav></div>${questionCard(exam[step],step,true)}<div class="lesson-bottom">${step>0?`<a class="button secondary" href="#/exam?step=${step-1}">← Zurück</a>`:'<a class="button secondary" href="#/">Zur Übersicht</a>'}${step<exam.length-1?`<a class="button" href="#/exam?step=${step+1}">Weiter →</a>`:state.exam.finished?'<a class="button" href="#/exam?result=1">Zur Gesamtauswertung →</a>':'<button class="button" data-action="finish-exam">Probeklausur abschließen →</button>'}</div>${state.exam.finished?'<div class="lesson-bottom"><a class="button link" href="#/exam?result=1">Gesamtauswertung ansehen</a></div>':'<p class="foot-note">Deine Antworten werden lokal zwischengespeichert. Du kannst die Seite schließen und später fortsetzen.</p>'}`;}

function saveView(){const s=stats();return `${bread([['Sichern & Laden']])}${intro('Dein Fortschritt gehört dir','Heute lernen. Morgen weitermachen.','Im selben Browser bleibt dein Lernstand automatisch erhalten. Mit einer Sicherungsdatei kannst du ihn auch auf einem anderen Gerät oder in einem anderen Browser laden.')}<div class="settings-grid"><section class="paper"><h2>↥ Lernstand sichern</h2><p>Lade eine kleine JSON-Datei mit Antworten, Fortschritt und Probeklausur herunter. Hebe sie auf oder übertrage sie auf dein anderes Gerät.</p><p><strong>${s.done} bearbeitete Aufgaben</strong><br/>${state.updated?'Zuletzt gespeichert: '+new Date(state.updated).toLocaleString('de-DE'):'Du kannst jederzeit die erste Sicherung anlegen.'}</p><div class="button-row"><button class="button" data-action="export">Sicherung herunterladen</button></div></section><section class="paper"><h2>↧ Lernstand laden</h2><p>Wähle eine Sicherungsdatei dieser gezielten Prüfungsfassung (Version 2). Ältere Sicherungen der breiteren Lernwelt gehören zu einer anderen Fassung. Nach deiner Bestätigung ersetzt sie den aktuellen Stand.</p><p>Die Datei wird direkt in diesem Browser gelesen. Sie wird nicht hochgeladen.</p><div class="button-row"><button class="button secondary" data-action="import">Sicherungsdatei auswählen</button></div></section><section class="paper full-width"><h2>🔒 So wird gespeichert</h2><p>Die automatische Speicherung gilt nur für dieses Gerät, diesen Browser und diese Webseitenadresse. Im privaten Modus oder nach dem Löschen der Browserdaten kann sie verloren gehen. Es gibt keine Anmeldung, keine Cloud-Synchronisation und keine Übertragung deiner Antworten an einen Server.</p>${!storageOK?'<div class="callout warning">Dein Browser erlaubt gerade kein zuverlässiges automatisches Speichern. Nutze bitte den Datei-Export.</div>':''}<div class="button-row"><button class="button secondary" data-action="reset-exam">Nur Probeklausur zurücksetzen</button><button class="button secondary" dat function aboutView(){return `${bread([['Über die Lernwelt']])}${intro('Wissen, das Wurzeln schlägt','Über Pflanzen-Entdecker','Gezieltes Lern- und Prüfungstraining nach deiner Themenabgrenzung für Biologie in Klasse 6.')}<div class="paper reading"><h2>Wie die Inhalte eingeordnet sind</h2><p>Diese Fassung folgt den drei Bereichen der bereitgestellten Themenabgrenzung: Bau der Blütenpflanze und der Blüte einschließlich Lebensformen; Wurzelhaare mit Lage, Lebensdauer, Oberflächenvergrößerung und Welken nach dem Umtopfen; Bestäubung und Befruchtung einschließlich Pollenschlauchweg und Merkmalen wind- und insektenblütiger Pflanzen. Sie ist für etwa 11- bis 12-Jährige gedacht.</p><h2>Wie die Rückmeldung funktioniert</h2><p>Auswahlfragen und Zuordnungen werden anhand fester Lösungen geprüft. Freie Antworten und Zeichnungen werden nicht automatisch benotet. Stattdessen vergleichst du sie mit einer Musterlösung und schätzt die passenden Punkte selbst ein. Der Lernstand zeigt bearbeitete Aufgaben, nicht automatisch sicher beherrschtes Wissen.</p><h2>Quellen und fachlicher Abgleich</h2><ul class="source-list"><li><a href="https://cuvo.nibis.de/cuvo.php?p=download&amp;upload=18" target="_blank" rel="noopener">Niedersächsisches Kultusministerium (2015): Kerncurriculum Gymnasium 5–10, Naturwissenschaften, Teil Biologie</a></li><li><a href="https://www.rhs.org.uk/advice/understanding-plants/how-plants-reproduce" target="_blank" rel="noopener">Royal Horticultural Society: How plants reproduce</a></li><li><a href="https://www.kew.org/kew-gardens/school-visits/browse-sessions/key-stage-3/plant-reproduction" target="_blank" rel="noopener">Royal Botanic Gardens, Kew: KS3 Plant reproduction</a></li><li><a href="https://www-archiv.fdm.uni-hamburg.de/b-online/d05/05b.htm" target="_blank" rel="noopener">Universität Hamburg: Rhizodermis und Wurzelhaare</a></li><li><a href="https://www.uni-ulm.de/fileadmin/website_uni_ulm/nawi.inst.240/allgemeine/allgemeine_botanik_hoppe_v2.1.2.pdf" target="_blank" rel="noopener">Universität Ulm, J. R. Hoppe: Allgemeine Botanik, Wurzelhaare und Lebensformen</a></li><li><a href="https://www.rhs.org.uk/plants/types/perennials/growing-guide" target="_blank" rel="noopener">RHS: Mehrjährige krautige Pflanzen</a></li></ul><p>Die Inhalte und vereinfachten Zeichnungen wurden eigens erstellt. Die Zahlen zur Oberfläche sind erfundene Modellwerte. Fachlicher Abgleich: 26. Oktober 2026.</p><h2>Datenschutz und Technik</h2><p>Die Seite verwendet keine Analyse- oder Werbedienste und lädt keine externen Schriften. Antworten werden nur im lokalen Browser-Speicher aufbewahrt. Beim normalen Seitenaufruf gelten die technischen Zugriffsverarbeitungen des Hosting-Anbieters GitHub Pages. Eine Sicherungsdatei wird ausschließlich lokal eingelesen.</p><a class="button" href="#/">Zur Lernübersicht →</a></div>`;}

 if(action==='move'){const a=answer(q,isExam);if((isExam&&state.exam.finished)||a.checked)return;const value=[...a.value],i=Number(b.dataset.position),j=i+Number(b.dataset.dir);if(j<0||j>=value.length)return;[value[i],value[j]]=[value[j],value[i]];setAnswer(q.id,{value},isExam);render(false);$(`[data-action="move"][data-q="${q.id}"][data-position="${j}"][data-dir="${b.dataset.dir}"]`)?.focus({preventScroll:true});}

function setupTraceCanvases(){
 for(const canvas of main.querySelectorAll('canvas[data-canvas]')){
  const q=allQuestions.find(q=>q.id===canvas.dataset.canvas),isExam=q.id.startsWith('e'),a=answer(q,isExam),ctx=canvas.getContext('2d');
  function paint(strokes){ctx.clearRect(0,0,720,450);ctx.strokeStyle='#236bca';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';for(const stroke of strokes){if(stroke.length<2)continue;ctx.beginPath();ctx.moveTo(...stroke[0]);for(const point of stroke.slice(1))ctx.lineTo(...point);ctx.stroke();}}
  paint(cleanTrace(a.value).strokes);if(canvas.dataset.locked)return;
  let active=null,strokes=cleanTrace(a.value).strokes;
  const point=e=>{const r=canvas.getBoundingClientRect();return[Math.max(0,Math.min(720,(e.clientX-r.left)/r.width*720)),Math.max(0,Math.min(450,(e.clientY-r.top)/r.height*450))];};
  canvas.addEventListener('pointerdown',e=>{if(e.button!==0||strokes.length>=40)return;e.preventDefault();active=[point(e)];canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointermove',e=>{if(!active)return;if(active.length<1200)active.push(point(e));paint([...strokes,active]);});
  const finish=e=>{if(!active)return;if(active.length>=2)strokes.push(active);active=null;const value=cleanTrace(answer(q,isExam).value);value.strokes=strokes;setAnswer(q.id,{value,checked:false},isExam);paint(strokes);};
  canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
 }
}
