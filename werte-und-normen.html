stimmen.", "rubric": ["Passendes Ziel (1 P.).", "Zwei machbare Schritte (je 1 P.).", "Sinnvolle Hilfe (1 P.).", "Grenze des Einflusses erklärt (2 P.)."], "points": 6, "id": "klausur_5"}, {"type": "written", "prompt": "6. Material B (erfunden): Jona läuft als Letzter ins Ziel, hat aber erstmals die ganze Strecke geschafft. Er sagt: „Ich bin ein Versager.“ Beurteile seine Einschätzung mit zwei verschiedenen Erfolgsmaßstäben.", "model": "Nach der Platzierung war Jona nicht weit vorne. Gemessen an seinem persönlichen Ziel hat er einen Fortschritt erreicht. Das Ergebnis macht ihn nicht als Menschen zum Versager; sein pauschales Urteil ist nicht gerechtfertigt.", "rubric": ["Platzierungsmaßstab (1 P.).", "Persönlichen Maßstab mit Fortschritt erklärt (2 P.).", "Menschenwert vom Ergebnis getrennt (1 P.).", "Abgewogenes begründetes Urteil (2 P.)."], "points": 6, "id": "klausur_6"}, {"type": "match", "prompt": "7. Ordne die eindeutigen Beispiele zu.", "labels": ["Regelmäßig üben", "Ein günstiges Los ziehen", "Ein ruhiger Lernraum wird bereitgestellt", "„Ich muss immer Erster sein“"], "options": ["Eigener Beitrag", "Zufall", "Unterstützende Bedingung", "Überzogene eigene Erwartung"], "answer": [0, 1, 2, 3], "explain": "Einflussfaktoren unterscheiden; daraus folgt keine Erfolgsgarantie.", "points": 4, "id": "klausur_7"}, {"type": "written", "prompt": "8. Entwirf für Jona aus Material B eine hilfreiche Reaktion: einen tröstenden Satz, eine faire Einschätzung und einen machbaren nächsten Schritt.", "model": "„Das ist enttäuschend; möchtest du erzählen?“ Jona hat seine Strecke erstmals geschafft, auch wenn er Letzter war. Wenn er möchte, kann er nach Erholung mit geeigneter Begleitung ein realistisches nächstes Trainingsziel planen.", "rubric": ["Respektvoller Trost (1 P.).", "Faire Einschätzung mit Fortschritt (2 P.).", "Passender machbarer Schritt (1 P.).", "Gefühle und Freiwilligkeit berücksichtigt (1 P.)."], "points": 5, "id": "klausur_8"}, {"type": "written", "prompt": "9. Beurteile: „Wer viele Likes hat, braucht keine anderen Bedingungen für ein glückliches Leben.“ Nenne ein mögliches Pro-Argument, einen Einwand und ein begründetes Urteil.", "model": "Likes können Anerkennung und Freude vermitteln. Sie garantieren jedoch weder Vertrauen noch Sicherheit oder verlässliche Unterstützung. Deshalb können sie ein Aspekt sein, ersetzen aber nicht alle anderen Bedingungen.", "rubric": ["Mögliches Pro-Argument (1 P.).", "Nachvollziehbarer Einwand (2 P.).", "Begründetes abgewogenes Urteil (2 P.)."], "points": 5, "id": "klausur_9"}, {"type": "written", "prompt": "10. Material C (erfunden): Eine Klasse möchte ein Fest mit lauter Musik. Einige wünschen Ruhe, andere sorgen sich um viel Müll. Entwickle einen verantwortlichen Vorschlag mit zwei Maßnahmen und begründe ihn aus zwei Perspektiven.", "model": "Ein ruhiger Bereich berücksichtigt Personen mit Ruhebedarf. Mehrweggeschirr kann Müll vermeiden, braucht aber eine verabredete Rückgabe und Reinigung. Die Klasse bespricht Wünsche und Aufgaben gemeinsam mit der Lehrkraft. Andere praktikable Lösungen sind möglich.", "rubric": ["Zwei machbare Maßnahmen (je 1 P.).", "Zwei Perspektiven mit passendem Grund (je 1 P.).", "Umsetzung oder Zuständigkeit (1 P.).", "Abgewogener Gesamtvorschlag (1 P.)."], "points": 6, "id": "klausur_10"}, {"type": "written", "prompt": "11. Erkläre an einem erfundenen Beispiel, wie ein Vorbild bei einem Zukunftswunsch helfen kann und warum kritisches Prüfen nötig bleibt.", "model": "Eine geduldige Zeichnerin kann ein Kind zu regelmäßigem Üben ermutigen. Ihre Ausdauer kann Vorbild sein; ihre Werbung oder andere Ansichten müssen nicht übernommen werden.", "rubric": ["Konkreter hilfreicher Vorbildaspekt (1 P.).", "Bezug zum Zukunftswunsch (1 P.).", "Begründete Grenze der Nachahmung (2 P.)."], "points": 4, "id": "klausur_11"}, {"type": "written", "prompt": "12. Beurteile: „Jeder ist allein für sein Glück verantwortlich.“ Berücksichtige eigene Möglichkeiten und äußere Bedingungen und f iede anhand geeigneter Gesichtspunkte herausarbeiten."], ["Beurteilen", "Anhand von Gesichtspunkten zu einem begründeten Urteil kommen."]];

function complete(q,v){if(q.type==='written')return typeof v==='string'&&v.trim().length>0;if(q.type==='choice')return Number.isInteger(v)&&v>=0&&v<q.options.length;if(q.type==='match')return Array.isArray(v)&&v.length===q.labels.length&&v.every(x=>Number.isInteger(x)&&x>=0&&x<q.options.length);if(q.type==='order')return Array.isArray(v)&&v.length===q.items.length&&new Set(v).size===q.items.length&&v.every(x=>Number.isInteger(x)&&x>=0&&x<q.items.length);return false;}
function grade(q,v){if(q.type==='choice')return v===q.answer?q.points:0;if(q.type==='match')return Math.round(q.answer.reduce((n,x,i)=>n+(v?.[i]===x),0)/q.answer.length*q.points*100)/100;if(q.type==='order')return q.answer.every((x,i)=>v?.[i]===x)?q.points:0;return null;}
function summary(qs,answers){let score=0,pending=0;for(const q of qs){const a=answers[q.id];if(a?.checked)score+=a.score||0;else pending+=q.points;}return {score:Math.round(score*100)/100,total:qs.reduce((a,q)=>a+q.points,0),pending,answered:qs.filter(q=>complete(q,answers[q.id]?.value)).length};}
function cleanAnswers(src,qs){const out={};if(!src||typeof src!=='object'||Array.isArray(src))return out;for(const q of qs){const a=src[q.id];if(!a||typeof a!=='object')continue;let v;if(q.type==='written'&&typeof a.value==='string')v=a.value.slice(0,12000);else if(q.type==='choice'&&complete(q,a.value))v=a.value;else if(q.type==='match'&&Array.isArray(a.value)&&a.value.length===q.labels.length)v=a.value.map(x=>Number.isInteger(x)&&x>=0&&x<q.options.length?x:null);else if(q.type==='order'&&complete(q,a.value))v=[...a.value];if(v===undefined)continue;const x={value:v,checked:a.checked===true,modelShown:a.modelShown===true};if(q.type==='written'){if(x.checked&&x.modelShown&&Number.isInteger(a.score)&&a.score>=0&&a.score<=q.points&&(complete(q,v)||a.score===0))x.score=a.score;else x.checked=false;}else if(x.checked)x.score=grade(q,v);out[q.id]=x;}return out;}

const $=(s,el=document)=>el.querySelector(s),main=$('#main'),sidebar=$('#sidebar');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const practice=allLessons.flatMap(l=>l.questions),allQuestions=[...practice,...assessments.flatMap(a=>a.questions)];
let state=fresh(),readings={},route={},storageOK=true,toastTimer;
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state=validateState(JSON.parse(raw),allLessons,assessments);}catch{storageOK=false;}
function save(){state.updated=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true;}catch{storageOK=false;}$('#saveStatus').textContent=storageOK?'Lokal gespeichert':'Bitte Datei sichern';}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),4000);}
function shuffle(n,seed){let a=[...Array(n).keys()],v=[...seed].reduce((s,c)=>s+c.charCodeAt(0),11);for(let i=n-1;i>0;i--){v=(v*1664525+1013904223)>>>0;let j=v%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function answer(q,test=''){return(test?state.tests[test]?.answers:state.answers)?.[q.id]||{value:q.type==='written'?'':q.type==='match'?q.labels.map(()=>null):q.type==='order'?shuffle(q.items.length,q.id):null,checked:false};}
function put(q,up,test=''){const dest=test?state.tests[test].answers:state.answers;dest[q.id]={...answer(q,test),...up};save();const counter=$('#testAnswered');if(test&&counter&&!state.tests[test].finished){const a=assessments.find(a=>a.id===test);counter.textContent=summary(a.questions,state.tests[test].answers).answered+' / '+a.questions.length+' beantwortet';}}
const theme=c=>`--accent:${c.color};--tint:${c.tint}`;
const progress=(p)=>`<div class="progress-track" role="progressbar" aria-label="Bearbeitete Übungen" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${p}%"></div></div>`;

function assessmentCard(a){const t=state.tests[a.id],s=t?summary(a.questions,t.answers):null;return `<a class="chapter-card assessment-card" href="#/test/${a.id}"><div class="card-top"><span class="chapter-icon">${a.kind==='exam'?'✏️':a.kind==='overall'?'✦':'✓'}</span><span class="chapter-number">${a.kind==='module'?'THEMENPRÜFUNG':a.kind==='overall'?'ALLES VERBINDEN':'PROBEKLAUSUR'}</span></div><h3>${a.title}</h3><p>${a.subtitle}</p><div class="chapter-meta"><span>${a.questions.length} Aufgaben · ${a.questions.reduce((n,q)=>n+q.points,0)} Punkte</span><span>ca. ${a.minutes} Min.</span></div><div class="test-status">${t?.finished?`${s.score} Punkte eingeschätzt${s.pending?' · freie Aufgaben noch offen':''}`:t?.started?'Begonnen – fortsetzen →':'Bereit, wenn du es bist →'}</div></a>`;}
function home(){const next=allLessons.find(l=>l.id===state.lastLesson)||allLessons[0];return `<section class="hero"><div class="hero-copy"><div class="eyebrow">Werte und Normen · Klasse 6</div><h1>Dem Glück<br/><em>auf der Spur.</em></h1><p>Was macht ein gutes Leben aus? Entdecke Wünsche, Chancen und eigene Wege – mit Bildern, Erklärungen und Fragen, die zum Denken einladen.</p><a class="button" href="#/lesson/${next.id}">${state.lastLesson?'Weiterlernen':'Entdeckungsreise starten'} →</a></div><div class="hero-art">${artwork('hero')}</div></section><div class="mini-stats"><div class="mini-stat"><span class="stat-icon">📚</span><div><strong>12 Einheiten</strong><span class="label">verständlich erklärt</span></div></div><div class="mini-stat"><span class="stat-icon">✦</span><div><strong>${done(practice)} / ${practice.length}</strong><span class="label">Übungen bearbeitet</span></div></div><div class="mini-stat"><span class="stat-icon">✓</span><div><strong>4 Module</strong><span class="label">plus 2 Abschlussprüfungen</span></div></div></div><div class="scope-hint"><b>Am Lehrplan geprüft:</b> „Glück und Lebensgestaltung“ gehört zum Doppeljahrgang 5/6 am Gymnasium Niedersachsen. Eure genaue Klassenarbeitsabgrenzung ist noch unbekannt. <a href="#/sources">Einordnung und Quellen ansehen →</a></div><div class="section-heading"><div><h2>Verstehen. Ausprobieren. Weiterdenken.</h2><p>Vier Themen begleiten dich Schritt für Schritt.</p></div></div><div class="chapter-grid">${chapters.map((c,i)=>`<a class="chapter-card" style="${theme(c)}" href="#/chapter/${c.id}"><div class="card-top"><span class="chapter-icon">${c.icon}</span><span class="chapter-number">THEMA 0${i+1}</span></div><h3>${c.title}</h3><p>${c.subtitle}</p><div class="chapter-meta"><span>3 Lerneinheiten</span><span>9 Übungen</span></div>${progress(Math.round(done(c.lessons.flatMap(l=>l.questions))/9*100))}</a>`).join('')}</div><div class="section-heading"><div><h2>Bereit für deinen Wissenscheck?</h2><p>Erst ein Thema prüfen, dann alles verbinden und zum Schluss eine Probeklausur bearbeiten.</p></div></div><div class="chapter-grid">${assessments.filter(a=>a.kind!=='module').map(assessmentCard).join('')}</div><p class="foot-note">Keine Anmeldung. Keine externen Schriften. Antworten bleiben im Browser. Nutze „Sichern & Laden“, um deinen Stand mitzunehmen.</p>${!storageOK?'<div class="callout warning">Automatisches Speichern ist eingeschränkt. Bitte sichere deinen Stand regelmäßig als Datei.</div>':''}`;}
function chapterView(c){return `${crumb(c.title)}<section class="chapter-banner" style="${theme(c)}"><span class="chapter-icon">${c.icon}</span><div><div class="eyebrow">Thema ${chapters.indexOf(c)+1} von 4</div><h1>${c.title}</h1><p>${c.subtitle}</p></div></section><div class="lesson-list">${c.lessons.map((l,i)=>`<a class="lesson-list-item" href="#/lesson/${l.id}"><span class="lesson-index">${done(l.questions)===l.questions.length?'✓':i+1}</span><div class="lesson-item-copy"><h2>${l.title}</h2><p>${l.scope} · ca. ${l.time} Min. · ${done(l.questions)}/${l.questions.length} Übungen</p></div><span>→</span></a>`).join('')}</div><div class="callout">💡 Lies erst die Erklärung und probiere danach die Übungen. Das Prüfungsmodul enthält neue Fragen und zeigt Lösungen erst nach dem Abschließen.</div>${assessmentCard(assessments[chapters.indexOf(c)])}`;}
const note=(key,label,placeholder='Erfundene Beispiele sind willkommen.')=>`<label class="field-label" for="note-${key}">${label}</label><textarea id="note-${key}" class="written-answer" data-note="${key}" maxlength="4000" placeholder="${placeholder}">${esc(state.notes[key]||'')}</textarea>`;
function lab(kind){
if(kind==='garden'){const selected=Array.isArray(state.notes.garden)?state.notes.garden:[];return `<section class="think-lab"><div class="eyebrow">Zum Nachdenken · ohne Punkte</div><h3>Dein Garten möglicher Lebensbedingungen</h3><p>Wähle Dinge, die du für eine erfundene Person wichtig findest. Du musst keine privaten Angaben machen. Es gibt keine richtige Auswahl und keinen Glückswert.</p><div class="garden-options">${['Beziehungen','Sicherheit','Gesundheit','Selbstbestimmung','Erholung','Sinnvolle Tätigkeit'].map((v,i)=>`<label class="garden-chip"><input type="checkbox" data-garden="${v}" ${selected.includes(v)?'checked':''}><span>${['🌿','🏡','🌻','🧭','🌳','🪴'][i]} ${v}</span></label>`).join('')}</div><p id="gardenReflection" class="lab-reflection" aria-live="polite">${gardenReflection(selected)}</p></section>`;}
if(kind==='planner')return `<section class="think-lab"><div class="eyebrow">Deine Planwerkstatt · ohne Punkte</div><h3>Ein Wunsch wird konkreter</h3><p>Plane für eine erfundene Person. Die Notizen werden mit deinem Lernstand gesichert.</p>${note('wish','1. Ein Zukunftswunsch')}${note('goal','2. Ein konkretes, erreichbares Ziel')}${note('step','3. Ein nächster Schritt')}${note('help','4. Hilfe und Grenzen des eigenen Einflusses')}<p class="lab-reflection">Prüffrage: Passt der Schritt zum Ziel? Ist er machbar? Sind andere Menschen betroffen?</p></section>`;
if(kind==='influence')return `<section class="think-lab"><div class="eyebrow">Perspektiven ausprobieren · ohne Punkte</div><h3>Was liegt in meinem Einfluss?</h3><p>Eine erfundene Schülerin bereitet ein Referat vor. Klicke auf einen Blickwinkel.</p><div class="button-row">${[['eigen','Eigener Beitrag'],['umfeld','Bedingungen'],['zufall','Zufall']].map(([v,t])=>`<button class="button secondary" data-action="influence" data-value="${v}" aria-pressed="${state.notes.influence===v}">${t}</button>`).join('')}</div><p id="influenceText" class="lab-reflection" aria-live="polite">${influenceText(state.notes.influence)}</p></section>`;
return `<section class="think-lab"><div class="eyebrow">Entscheidungswerkstatt · ohne Punkte</div><h3>Ein Klassenfest – mehrere Perspektiven</h3><p>Schau nacheinander durch die verschiedenen Brillen. Welche Lösung könnte mehrere Wünsche berücksichtigen?</p><div class="button-row">${[['musik','Musikfans'],['ruhe','Ruhebedarf'],['umwelt','Aufräumteam']].map(([v,t])=>`<button class="button secondary" data-action="decision" data-value="${v}" aria-pressed="${state.notes.decision===v}">${t}</button>`).join('')}</div><p id="decisionText" class="lab-reflection" aria-live="polite">${decisionText(state.notes.decision)}</p></section>`;
}
function gardenReflection(values){return values.length?'Du hast '+values.map(esc).join(', ')+' ausgewählt. Wie könnte eines davon helfen? Welche weiteren Bedingungen könnte die Person brauchen?':'Welche Bedingungen möchtest du näher betrachten? Wähle frei aus und begründe anschließend ein Beispiel.';}
function influenceText(v){return({eigen:'Eigener Beitrag: ein überschaubares Übungsziel setzen, Quellen lesen und rechtzeitig Hilfe erfragen. Auch eigene Möglichkeiten können begrenzt sein.',umfeld:'Bedingungen: Ein ruhiger Raum, verfügbares Material und Unterstützung können helfen. Eine Lerngruppe oder die Schule kann passende Hilfe organisieren.',zufall:'Zufall: Ein überraschender technischer Ausfall kann das Ergebnis beeinflussen. Ein Ersatzplan kann helfen, aber nicht jedes Ereignis verhindern.'})[v]||'Wähle einen Blickwinkel. Die drei Seiten ergänzen sich; keine erklärt jedes Ergebnis allein.';}
function decisionText(v){return({musik:'Musikfans: „Wir möchten zusammen tanzen.“ Denkfrage: Wie könnten Musikzeiten und Lautstärke vereinbart werden?',ruhe:'Ruhebedarf: „Ich möchte mitfeiern, brauche aber zwischendurch Ruhe.“ Denkfrage: Gibt es einen zugänglichen ruhigeren Bereich?',umwelt:'Aufräumteam: „Wir möchten wenig Müll und faire Aufgaben.“ Denkfrage: Welche Mehrweglösung ist machbar und wer übernimmt welche Aufgabe?'})[v]||'Wähle eine Perspektive. Ein guter Plan hört mehrere Stimmen und berücksichtigt absehbare Folgen.';}
function reading(l){const r=readings[l.id];return `<div class="paper reading"><div class="scope-label">${esc(l.scope)}</div>${artwork(r.art)}${r.sections.map(([h,t])=>`<h2>${h}</h2><p>${t}</p>`).join('')}${r.lab?lab(r.lab):''}<div class="reading-end"><a href="#/sources">Lehrplanbezug und Quellen →</a><button class="button secondary small" data-action="print">Diese Seite drucken</button></div></div>`;}
function questionCard(q,index,test=''){
const a=answer(q,test),finished=!!state.tests[test]?.finished,locked=test?finished:(a.checked||a.modelShown),show=test?finished:(a.checked||a.modelShown);let html='';
if(q.type==='choice')html=`<fieldset><legend>Wähle eine Antwort.</legend>${shuffle(q.options.length,q.id).map(i=>`<label class="choice ${a.value===i?'selected':''} ${show&&i===q.answer?'correct':''}"><input type="radio" name="${q.id}" data-answer="${q.id}" value="${i}" ${a.value===i?'checked':''} ${locked?'disabled':''}><span>${esc(q.options[i])}</span></label>`).join('')}</fieldset>`;
if(q.type==='match')html=q.labels.map((t,i)=>`<div class="match-row"><label for="${q.id}-${i}">${esc(t)}</label><select id="${q.id}-${i}" data-answer="${q.id}" data-index="${i}" ${locked?'disabled':''}><option value="">Bitte zuordnen …</option>${shuffle(q.options.length,q.id).map(j=>`<option value="${j}" ${a.value?.[i]===j?'selected':''}>${esc(q.options[j])}</option>`).join('')}</select></div>`).join('');
if(q.type==='order')html=`<p class="question-help">Ordne die Schritte mit den Pfeilen von oben nach unten.</p><ol class="order-list">${a.value.map((id,i)=>`<li class="order-item"><span class="order-position">${i+1}</span><span class="order-text">${esc(q.items[id])}</span><span class="order-buttons"><button data-action="move" data-q="${q.id}" data-position="${i}" data-dir="-1" aria-label="Schritt ${i+1} nach oben" ${locked||i===0?'disabled':''}>↑</button><button data-action="move" data-q="${q.id}" data-position="${i}" data-dir="1" aria-label="Schritt ${i+1} nach unten" ${locked||i===a.value.length-1?'disabled':''}>↓</button></span></li>`).join('')}</ol>`;
if(q.type==='written')html=`<label class="field-label" for="text-${q.id}">Deine begründete Antwort</label><textarea id="text-${q.id}" class="written-answer" data-answer="${q.id}" maxlength="12000" ${locked?'readonly':''} placeholder="Nutze eigene Worte und gern erfundene Beispiele …">${esc(a.value)}</textarea><p class="question-help">Offene Antwort: ${test?'Nach dem Abschließen':'Anschließend'} vergleichst du Gründe, Beispiele und Aufgabenbezug mit einer Beispielantwort. Deine private Meinung wird nicht automatisch benotet.</p>`;
let feedback='';
if(show&&isSelfAssessed(q))feedback=`<div class="feedback model" id="feedback-${q.id}" tabindex="-1"><strong>💭 Beispielantwort · andere gut begründete Antworten sind möglich</strong><p>${esc(q.model)}</p><ul>${q.rubric.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><div class="self-label">Welche Punkte erfüllt deine Antwort?</div><div class="score-select" role="group" aria-label="Selbsteinschätzung">${Array.from({length:q.points+1},(_,i)=>`<button data-action="selfscore" data-q="${q.id}" data-score="${i}" aria-pressed="${a.checked&&a.score===i}">${i}</button>`).join('')}</div><p class="question-help">${a.checked?`Selbst eingeschätzt: ${a.score} / ${q.points} Punkte.`:'Noch nicht eingeschätzt. Eine leere Antwort kann nur 0 Punkte bekommen.'}</p></div>`;
else if(show)feedback=`<div class="feedback ${a.score===q.points?'':'retry'}" id="feedback-${q.id}" tabindex="-1"><strong>${a.score===q.points?'✓ Richtig zugeordnet!':'↻ Schau dir die Erklärung an.'}</strong><p>${esc(q.explain)}</p>${q.type==='choice'?`<p>Passende Antwort: <b>${esc(q.options[q.answer])}</b></p>`:q.type==='match'?q.labels.map((t,i)=>`<span class="solution-line">${esc(t)} → <b>${esc(q.options[q.answer[i]])}</b></span>`).join(''):`<ol>${q.answer.map(i=>`<li>${esc(q.items[i])}</li>`).join('')}</ol>`}<p>${a.score} / ${q.points} Punkte</p></div>`;
return `<article class="question-card" id="question-${q.id}" data-test="${test}"><div class="question-top"><span class="question-index">${test?'Aufgabe':'Übung'} ${index+1}${isSelfAssessed(q)?' · offen':''}</span><span class="question-points">${q.points} ${q.points===1?'Punkt':'Punkte'}</span></div><h3>${esc(q.prompt)}</h3>${html}${!test?`<div class="question-actions"><button class="button small ${show?'secondary':''}" data-action="${show?'retry':'check'}" data-q="${q.id}">${show?'Noch einmal versuchen':isSelfAssessed(q)?'Mit Beispielantwort vergleichen':'Antwort prüfen'}</button></div>`:''}${feedback}</article>`;
}
function lessonView(l,c){const pr=route.tab==='practice',ix=allLessons.findIndex(x=>x.id===l.id),next=allLessons[ix+1];return `${crumb(c.title)}${intro(l.scope,l.title,'Erst verstehen, dann mit eigenen Worten erklären und üben.')}<div class="lesson-layout"><div><div class="tabs" role="tablist" aria-label="Lerneinheit"><button role="tab" aria-selected="${!pr}" class="${!pr?'active':''}" data-action="tab" data-tab="read">📖 Verstehen</button><button role="tab" aria-selected="${pr}" class="${pr?'active':''}" data-action="tab" data-tab="practice">✏️ Üben ${done(l.questions)}/${l.questions.length}</button></div><section role="tabpanel" aria-label="${pr?'Übungen':'Erklärung'}">${pr?l.questions.map((q,i)=>questionCard(q,i)).join(''):reading(l)}</section><div class="lesson-bottom"><a class="button secondary" href="#/chapter/${c.id}">← Themenübersicht</a>${!pr?'<button class="button" data-action="read-done">Gelesen – jetzt üben →</button>':next?`<a class="button" href="#/lesson/${next.id}">Nächste Einheit →</a>`:'<a class="button" href="#/checks">Zu den Prüfungsmodulen →</a>'}</div></div><aside class="lesson-rail"><h2>In diesem Thema</h2>${c.lessons.map((x,i)=>`<a class="rail-item ${x.id===l.id?'active':''}" href="#/lesson/${x.id}">${i+1}. ${x.title}</a>`).join('')}<a class="rail-item" href="#/test/m${chapters.indexOf(c)+1}">✓ Thema prüfen</a><p class="rail-meta">${state.read.includes(l.id)?'✓ Als gelesen markiert':'Noch nicht als gelesen markiert'}<br/>${done(l.questions)} von 3 Übungen bearbeitet</p></aside></div>`;}
function checksView(){return `${crumb('Prüfungsmodule')}${intro('Ein Thema nach dem anderen','Deine vier Prüfungsmodule','Neue Aufgaben zu jedem Bereich. Lösungen erscheinen erst nach dem Abschließen. Jeder Test hat einen eigenen gespeicherten Stand.')}<div class="chapter-grid">${assessments.filter(a=>a.kind==='module').map(assessmentCard).join('')}</div><div class="section-heading"><h2>Danach: alles zusammenbringen</h2></div><div class="chapter-grid">${assessments.filter(a=>a.kind!=='module').map(assessmentCard).join('')}</div>`;}
function testView(a){const t=state.tests[a.id],total=a.questions.reduce((n,q)=>n+q.points,0);if(!t?.started)return `${crumb(a.title)}${intro(a.kind==='exam'?'In Ruhe ausprobieren':'Dein Wissenscheck',a.title,a.subtitle)}<div class="paper exam-intro"><div><h2>So funktioniert’s</h2><ol class="exam-steps"><li>Arbeite möglichst ohne Hilfen. Du kannst zwischen den Aufgaben wechseln.</li><li>Lösungen werden erst nach dem Abschließen sichtbar.</li><li>Auswahl und Zuordnung werden automatisch geprüft. Freie Antworten schätzt du mit Beispielantworten und Punkthinweisen selbst ein.</li><li>Deine privaten Gefühle und Wünsche werden nicht bewertet. Erfundene Beispiele sind erlaubt.</li><li>Die Zeit ist eine Orientierung; es gibt keinen Countdown. Der Test bleibt beim Neuladen erhalten.</li></ol><button class="button" data-action="start-test" data-id="${a.id}">Jetzt starten →</button></div><div class="exam-facts"><div><strong>${total}</strong><p>Punkte</p></div><div><strong>${a.questions.length}</strong><p>Aufgaben</p></div><div><strong>${a.minutes}</strong><p>Minuten ungefähr</p></div></div></div><p class="foot-note">Eigenständig erstellte Übung, keine amtliche Prüfung und kein verbindlicher Notenschlüssel.</p>`;
const s=summary(a.questions,t.answers);if(route.result&&t.finished)return `${crumb(a.title)}${intro('Deine Auswertung',a.title,s.pending?'Die automatischen Aufgaben sind geprüft. Schätze die offenen Antworten noch ein.':'Alle Punkte sind ausgewertet. Freie Antworten sind selbst eingeschätzt.')}<div class="result-grid"><div class="result-tile"><strong>${s.score} / ${total}</strong><small>${s.pending?'bisher bewertete Punkte':'Punkte einschließlich Selbsteinschätzung'}</small></div><div class="result-tile"><strong>${s.pending}</strong><small>mögliche Punkte noch offen</small></div></div><div class="paper">${a.questions.map((q,i)=>{const x=t.answers[q.id];return `<div class="result-item"><a href="#/test/${a.id}?step=${i}">Aufgabe ${i+1} · ${isSelfAssessed(q)?'selbst einschätzen':'automatisch geprüft'}</a><strong>${x?.checked?`${x.score} / ${q.points}`:'Noch einschätzen'}</strong></div>`}).join('')}</div><div class="callout">Wiederhole die passenden Erklärungen. Bei freien Antworten zählen tragfähige Gründe, ein passendes Beispiel und Aufgabenbezug. Die Beispielantwort ist keine vorgeschriebene persönliche Meinung.</div><div class="lesson-bottom"><a class="button secondary" href="#/checks">Alle Prüfungen</a><button class="button secondary" data-action="reset-test" data-id="${a.id}">Diesen Test neu beginnen</button></div>`;
const step=Math.min(a.questions.length-1,Math.max(0,Number(route.step)||0));return `${crumb(a.title)}<div class="exam-head"><div><strong>${esc(a.title)}</strong><small id="testAnswered">${t.finished?'Abgeschlossen · Antworten vergleichen':s.answered+' / '+a.questions.length+' beantwortet'}</small></div><nav class="exam-nav" aria-label="Prüfungsaufgaben">${a.questions.map((q,i)=>`<button data-action="test-step" data-step="${i}" class="${step===i?'active':''} ${complete(q,answer(q,a.id).value)?'answered':''}" aria-label="Aufgabe ${i+1}" ${step===i?'aria-current="step"':''}>${i+1}</button>`).join('')}</nav></div>${questionCard(a.questions[step],step,a.id)}<div class="lesson-bottom">${step>0?`<a class="button secondary" href="#/test/${a.id}?step=${step-1}">← Zurück</a>`:'<a class="button secondary" href="#/checks">Alle Prüfungen</a>'}${step<a.questions.length-1?`<a class="button" href="#/test/${a.id}?step=${step+1}">Weiter →</a>`:t.finished?`<a class="button" href="#/test/${a.id}?result=1">Zur Auswertung →</a>`:`<button class="button" data-action="finish-test" data-id="${a.id}">Abschließen und auswerten →</button>`}</div>${t.finished?`<a class="button link" href="#/test/${a.id}?result=1">Gesamtauswertung dieses Tests</a>`:'<p class="foot-note">Antworten werden automatisch lokal zwischengespeichert. Zum Mitnehmen nutze zusätzlich „Sichern & Laden“.</p>'}`;}
function progressView(){return `${crumb('Mein Lernstand')}${intro('Jeder Schritt zählt','Dein Weg durch die Lernwelt','Bearbeitet heißt geprüft oder selbst eingeschätzt. Es bedeutet noch nicht automatisch, dass du alles sicher beherrschst.')}<div class="summary-top"><div class="score-ring" style="--value:${Math.round(done(practice)/practice.length*100)}"><strong>${done(practice)}/${practice.length}</strong></div><div><h2>Übungen bearbeitet</h2><p>${state.read.length} von 12 Erklärungen als gelesen markiert</p></div></div>${chapters.map(c=>`<section class="progress-chapter"><h2>${c.icon} ${c.title}</h2>${c.lessons.map(l=>`<div class="progress-lesson"><a href="#/lesson/${l.id}?tab=practice">${l.title}</a><small>${done(l.questions)}/3</small></div>`).join('')}</section>`).join('')}<div class="section-heading"><h2>Prüfungen separat</h2></div><div class="chapter-grid">${assessments.map(assessmentCard).join('')}</div>`;}
function glossaryView(){return `${crumb('Wörterbuch')}${intro('Begriffe verstehen','Ein Wort – ein Aha-Moment.')}<label class="field-label" for="glossarySearch">Begriff oder Erklärung durchsuchen</label><input id="glossarySearch" class="search-input" type="search" placeholder="Zum Beispiel: Erfolg, Vorbild, Verantwortung"><div id="glossaryResults" class="glossary-grid">${glossaryCards('')}</div>`;}
function glossaryCards(term){const found=glossary.filter(([a,b])=>(a+' '+b).toLocaleLowerCase('de').includes(term.toLocaleLowerCase('de')));return found.length?found.map(([a,b])=>`<article class="glossary-card"><h2>${esc(a)}</h2><p>${esc(b)}</p></article>`).join(''):'<p>Kein passender Begriff gefunden.</p>';}
function saveView(){return `${crumb('Sichern & Laden')}${intro('Heute lernen. Morgen weitermachen.','Dein Lernstand zum Mitnehmen','Im selben Browser wird automatisch gespeichert. Mit einer Sicherungsdatei kannst du auf einem anderen Gerät oder in einem anderen Browser weitermachen.')}<div class="settings-grid"><section class="paper"><h2>↥ Lernstand sichern</h2><p>Die JSON-Datei enthält Antworten, Prüfungsmodule, Gesamtabfrage, Probeklausur und Werkstattnotizen.</p><div class="button-row"><button class="button" data-action="export">Sicherung herunterladen</button></div></section><section class="paper"><h2>↧ Lernstand laden</h2><p>Wähle eine Sicherung dieser Glück-Lernwelt. Sie ersetzt nach deiner Bestätigung den aktuellen Stand. Chemie- und Biologiestände gehören zu anderen Lernseiten.</p><button class="button secondary" data-action="import">Sicherungsdatei auswählen</button></section><section class="paper full-width"><h2>🔒 Deine Antworten bleiben bei dir</h2><p>Keine Anmeldung, keine automatische Übertragung an einen Server. Eine Sicherungsdatei enthält auch deine freien Texte. Du kannst überall erfundene Beispiele verwenden. Automatisches Speichern hängt bei lokalen Dateien vom Browser ab; private Fenster oder gelöschte Browserdaten können den Stand verlieren.</p><p>Das Zurücksetzen betrifft nur diese Lernwelt in diesem Browser. Andere Fächer bleiben getrennt.</p><button class="button secondary" data-action="reset-all">Gesamten Glück-Lernstand zurücksetzen</button></section></div>`;}
function sourcesView(){return `${crumb('Lehrplan & Quellen')}${intro('Nachgeschlagen am 2. November 2026','Passt das zu Klasse 6?','Ja: „Glück und Lebensgestaltung“ ist im geltenden Kerncurriculum für das Gymnasium Niedersachsen dem Doppeljahrgang 5/6 zugeordnet.')}<div class="paper reading"><h2>Was diese Einordnung bedeutet</h2><p>Das offizielle Verzeichnis führt das Kerncurriculum von 2017 als verbindlich ab 1. August 2017 ohne angegebenes Enddatum. Die Kompetenzen gelten bis zum Ende von Jahrgang 6; die Schule bestimmt die Verteilung zwischen 5 und 6. Eine konkrete Klassenarbeitsabgrenzung oder euer Unterrichtsmaterial liegt nicht vor. Daher ist dies eine breite Vorbereitung zum Oberthema, keine Zusicherung des tatsächlichen Prüfungsstoffs.</p><h2>So ist jeder Themenbereich zugeordnet</h2><div class="table-wrap"><table><thead><tr><th>Einheiten</th><th>Einordnung</th><th>Nachweis / Funktion</th></tr></thead><tbody><tr><td>Bedingungen; Zukunftswünsche; Perspektiven</td><td>Kern</td><td>KC S. 20: Lebensvorstellungen und Zukunftswünsche untersuchen und vergleichen.</td></tr><tr><td>Maßstäbe; Einfluss; Rückschläge</td><td>Kern</td><td>KC S. 20: Erfolg und Misserfolg prüfen und Handlungsmöglichkeiten entwickeln.</td></tr><tr><td>Verantwortung planen</td><td>Kern</td><td>KC S. 20: Zukunft verantwortlich gestalten; Lebensbedingungen mitdenken.</td></tr><tr><td>Drei Bedeutungen; Wünsche und Bedürfnisse</td><td>Passende Vertiefung</td><td>Begriffsklärung und eigene Beispiele; Glück haben / glücklich sein auch im schulinternen Plan Osterholz-Scharmbeck, Jg. 6.</td></tr><tr><td>Vorbilder</td><td>Verbindung zum Nachbarthema</td><td>KC S. 19: Ich und meine Beziehungen.</td></tr><tr><td>Begründen; Prüfungswerkzeug</td><td>Methode</td><td>KC S. 14–15 und S. 37–38: Wahrnehmen, diskutieren, urteilen und Operatoren.</td></tr></tbody></table></div><p>Die direkt zum Leitthema ausgewiesenen Grundbegriffe sind hier als Erfolg/Misserfolg, glückliches Leben und Verantwortungsbewusstsein enthalten. Die Markierungen an jeder Lerneinheit machen Kern, Vertiefung, Verbindung und Methode sichtbar.</p><h2>Was die Aufgaben leisten</h2><p>Alle Geschichten, Bilder, Aufgaben und Beispielantworten wurden für diese Lernseite erstellt. Die Kinderprofile sind ausdrücklich erfunden und repräsentieren keine Kultur. Offene Urteile werden anhand von Gründen, Beispielen und Aufgabenbezug selbst eingeschätzt. Eine begründete andere Antwort kann richtig sein. Private Gefühle oder das eigene Glücksniveau werden nicht benotet. Es gibt keine Glücksmessung, keine Therapie und keinen vorgeschriebenen Lebensentwurf.</p><p>Die Probeklausur ist eine eigene Übung mit 60 Punkten. Umfang, Zeit und Punkte sind nicht amtlich festgelegt. Ausführliche philosophische Glückstheorien oder Inhalte späterer Jahrgänge werden nicht als Pflichtwissen verlangt.</p><h2>Primärquellen zum Nachlesen</h2><ul class="source-list"><li><a href="https://cuvo.nibis.de/index.php?p=detail_view&docid=1187" target="_blank" rel="noopener">Offizielles CuVo-Verzeichnis: Gültigkeit und Dokument</a></li><li><a href="https://cuvo.nibis.de/cuvo.php?p=download&upload=129" target="_blank" rel="noopener">Niedersächsisches Kultusministerium: Kerncurriculum Werte und Normen Gymnasium 5–10 (2017), besonders S. 19–20, 37–38</a></li><li><a href="https://gymnasium-ohz.de/wp-content/uploads/2025/08/SAP-neu-Stoffverteilung.pdf" target="_blank" rel="noopener">Gymnasium Osterholz-Scharmbeck: Schulinterner Arbeitsplan ab August 2025, Jahrgang 6</a></li><li><a href="https://www.kks-hannover.de/wp-content/uploads/2025/10/schulinterner-Arbeitsplan-Werte-und-Normen_Jg.-5-6.pdf" target="_blank" rel="noopener">Käthe-Kollwitz-Schule Hannover: Arbeitsplan 5/6, Umsetzung des Leitthemas</a></li></ul><p>Andere Schulen können die Reihenfolge und Schwerpunkte anders festlegen. Am genauesten wird die Vorbereitung mit eurem Heft oder einer späteren Eingrenzung der Lehrkraft.</p></div>`;}
function getRoute(){const [p,q]=(location.hash.slice(1)||'/').split('?'),parts=p.split('/').filter(Boolean),params=new URLSearchParams(q||'');const page=parts[0]||'home',id=parts[1];return {page,id,tab:params.get('tab'),step:params.get('step'),result:params.get('result'),chapter:page==='chapter'?id:page==='lesson'?allLessons.find(l=>l.id===id)?.chapter:null};}
function render(scroll=true){route=getRoute();const c=chapters.find(c=>c.id===route.chapter),l=allLessons.find(l=>l.id===route.id),a=assessments.find(a=>a.id===route.id);main.style.setProperty('--accent',c?.color||'#a65d35');main.style.setProperty('--tint',c?.tint||'#fff0d9');let html;
if(route.page==='home')html=home();else if(route.page==='chapter'&&c)html=chapterView(c);else if(route.page==='lesson'&&l){state.lastLesson=l.id;save();html=lessonView(l,c);}else if(route.page==='checks')html=checksView();else if(route.page==='test'&&a)html=testView(a);else if(route.page==='progress')html=progressView();else if(route.page==='save')html=saveView();else if(route.page==='glossary')html=glossaryView();else if(route.page==='sources')html=sourcesView();else html='<div class="paper"><h1>Diese Seite wurde nicht gefunden.</h1><a href="#/">Zur Übersicht</a></div>';
main.innerHTML=html;nav();document.title=(l?.title||a?.title||'Glück-Entdecker')+' · Werte und Normen 6';if(scroll){window.scrollTo({top:0,behavior:'instant'});main.focus({preventScroll:true});}}
async function confirmAction(title,text,yes='Ja, fortfahren'){const d=$('#confirmDialog');$('#dialogTitle').textContent=title;$('#dialogText').textContent=text;$('button[value="confirm"]',d).textContent=yes;d.showModal();return new Promise(resolve=>d.addEventListener('close',()=>resolve(d.returnValue==='confirm'),{once:true}));}
function closeMenu(){sidebar.classList.remove('open');$('#backdrop').hidden=true;$('#menuButton').setAttribute('aria-expanded','false');}
$('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({block:'start'});});
$('#menuButton').addEventListener('click',()=>{const open=!sidebar.classList.contains('open');sidebar.classList.toggle('open',open);$('#backdrop').hidden=!open;$('#menuButton').setAttribute('aria-expanded',String(open));});$('#backdrop').addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});sidebar.addEventListener('click',e=>{if(e.target.closest('a'))closeMenu();});
main.addEventListener('input',e=>{const x=e.target;if(x.id==='glossarySearch'){$('#glossaryResults').innerHTML=glossaryCards(x.value);return;}if(x.dataset.note){state.notes[x.dataset.note]=x.value;save();return;}if(x.tagName==='TEXTAREA'&&x.dataset.answer){const test=x.closest('[data-test]').dataset.test,q=allQuestions.find(q=>q.id===x.dataset.answer);if(test&&state.tests[test]?.finished)return;put(q,{value:x.value,checked:false},test);}});
main.addEventListener('change',e=>{const x=e.target;if(x.dataset.garden){state.notes.garden=[...main.querySelectorAll('[data-garden]:checked')].map(el=>el.dataset.garden);save();$('#gardenReflection').textContent=gardenReflection(state.notes.garden);return;}if(!x.dataset.answer||x.tagName==='TEXTAREA')return;const q=allQuestions.find(q=>q.id===x.dataset.answer),test=x.closest('[data-test]').dataset.test;if(test&&state.tests[test]?.finished)return;const value=x.tagName==='SELECT'?[...answer(q,test).value]:Number(x.value);if(Array.isArray(value))value[Number(x.dataset.index)]=x.value===''?null:Number(x.value);put(q,{value,checked:false},test);if(x.tagName==='INPUT')x.closest('fieldset').querySelectorAll('.choice').forEach(el=>el.classList.toggle('selected',$('input',el).checked));});
main.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,q=allQuestions.find(q=>q.id===b.dataset.q),test=b.closest('[data-test]')?.dataset.test||'';
if(action==='tab')location.hash='/lesson/'+route.id+(b.dataset.tab==='practice'?'?tab=practice':'');
if(action==='read-done'){if(!state.read.includes(route.id))state.read.push(route.id);save();location.hash='/lesson/'+route.id+'?tab=practice';}
if(action==='check'){const a=answer(q);if(!complete(q,a.value)){toast('Beantworte bitte zuerst alle Teile der Aufgabe.');return;}put(q,isSelfAssessed(q)?{modelShown:true}:{checked:true,score:grade(q,a.value)});render(false);$('#feedback-'+q.id)?.focus({preventScroll:true});}
if(action==='retry'){put(q,{checked:false,modelShown:false,score:undefined});render(false);}
if(action==='selfscore'){if(test&&!state.tests[test]?.finished)return;const score=Number(b.dataset.score);if(score>0&&!complete(q,answer(q,test).value)){toast('Eine leere Antwort kann nur 0 Punkte bekommen.');return;}put(q,{checked:true,modelShown:true,score},test);render(false);}
if(action==='move'){if(test&&state.tests[test]?.finished)return;const v=[...answer(q,test).value],i=Number(b.dataset.position),j=i+Number(b.dataset.dir);if(j<0||j>=v.length)return;[v[i],v[j]]=[v[j],v[i]];put(q,{value:v},test);render(false);$(`[data-action="move"][data-q="${q.id}"][data-position="${j}"][data-dir="${b.dataset.dir}"]`)?.focus({preventScroll:true});}
if(action==='start-test'){state.tests[b.dataset.id]={answers:{},started:Date.now(),finished:false};save();location.hash='/test/'+b.dataset.id+'?step=0';}
if(action==='test-step')location.hash='/test/'+route.id+'?step='+b.dataset.step;
if(action==='finish-test'){const a=assessments.find(a=>a.id===b.dataset.id),t=state.tests[a.id],s=summary(a.questions,t.answers);if(!await confirmAction('Test abschließen?',s.answered<a.questions.length?'Einige Aufgaben sind noch unvollständig. Du kannst sie vorher ergänzen oder jetzt auswerten.':'Danach erscheinen Lösungen und Punkthinweise für die Selbsteinschätzung.','Ja, auswerten'))return;for(const q of a.questions){const x=answer(q,a.id);t.answers[q.id]={...x,modelShown:true,checked:!isSelfAssessed(q),score:isSelfAssessed(q)?undefined:grade(q,x.value)};}t.finished=true;save();location.hash='/test/'+a.id+'?result=1';}
if(action==='reset-test'){if(!await confirmAction('Diesen Test zurücksetzen?','Nur Antworten und Ergebnis dieses Tests werden gelöscht. Alle anderen Prüfungen und Übungen bleiben erhalten.'))return;delete state.tests[b.dataset.id];save();location.hash='/test/'+b.dataset.id;render(false);}
if(action==='influence'||action==='decision'){state.notes[action]=b.dataset.value;save();const labEl=b.closest('.think-lab');labEl.querySelectorAll('button').forEach(btn=>btn.setAttribute('aria-pressed',String(btn===b)));$('#'+(action==='influence'?'influenceText':'decisionText')).textContent=action==='influence'?influenceText(b.dataset.value):decisionText(b.dataset.value);}

$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>2*1024*1024)throw Error('Bitte eine Sicherungsdatei bis 2 MB wählen.');const s=validateState(JSON.parse(await f.text()),allLessons,assessments);if(!await confirmAction('Lernstand laden?','Diese Sicherung ersetzt den aktuellen Glück-Lernstand einschließlich aller Prüfungen und Werkstattnotizen.','Ja, laden'))return;state=s;save();render(false);toast('Lernstand erfolgreich geladen.');}catch(err){toast('Laden nicht möglich: '+err.message);}});

try{readings={"drei-bedeutungen": {"art": "luck", "sections": [["Ein Wort, mehrere Bedeutungen", "„Ich hatte Glück!“ kann heißen: Ein günstiger Zufall hat mir geholfen. Du findest deinen verlorenen Schlüssel wieder, weil ihn jemand genau dort abgelegt hat, wo du suchst. Diesen Zufall kannst du nicht sicher planen. <b>Glück haben</b> beschreibt hier das Ereignis, nicht dein ganzes Leben."], ["Ein Moment und ein ganzes Leben", "<b>Glücklich sein</b> meint ein Erleben: Du freust dich, bist zufrieden oder fühlst dich verbunden. Das kann mit Zufall zusammenhängen, muss aber nicht. Nach einem lange geübten Musikstück kannst du glücklich sein, obwohl nichts zufällig war. Ein <b>glückliches Leben</b> ist eine weiter reichende Vorstellung davon, wie das eigene Leben insgesamt gelingen kann: etwa mit verlässlichen Beziehungen, Sicherheit, sinnvollen Tätigkeiten und Freiraum."], ["Die Grenzen sind nicht starr", "Eine Situation kann mehrere Seiten haben: Du gewinnst zufällig einen Ausflug und bist darüber glücklich. Das ist Zufallsglück und ein Glücksmoment. Umgekehrt muss ein Mensch, dessen Leben vieles Gutes enthält, nicht jeden Tag fröhlich sein. Traurigkeit und Enttäuschung gehören zum Leben. Niemand muss sich dafür rechtfertigen, gerade nicht glücklich zu sein."], ["Merke", "Frage immer: Geht es um einen günstigen Zufall, um ein momentanes Gefühl oder um Bedingungen eines ganzen Lebens? Die Unterscheidung hilft beim Erklären, ist aber kein Messgerät für Menschen."]], "lab": null}, "bedingungen": {"art": "garden", "sections": [["Keine Einkaufsliste für alle", "Stell dir ein gutes Leben wie einen Garten vor. Verschiedene Dinge können darin wachsen: Freundschaft, Gesundheit, Sicherheit, Selbstbestimmung, Lernen, Spiel und Erholung. Das Bild hilft beim Nachdenken. Es bedeutet nicht, dass es eine feste Liste oder eine richtige Menge Glück für jeden Menschen gibt."], ["Bedingungen und Garantie unterscheiden", "Sicherheit kann ermöglichen, ohne ständige Angst zu lernen und zu spielen. Eine verlässliche Beziehung kann Halt geben. Beides sind mögliche <b>Kriterien</b>: Gesichtspunkte, mit denen wir eine Lebensvorstellung prüfen. Eine Bedingung macht Glück eher möglich, garantiert es aber nicht. Gesundheit kann wichtig sein; trotzdem können auch kranke Menschen Freude, Verbundenheit und ein erfülltes Leben erfahren."], ["Dinge und Erfahrungen", "Materielle Dinge sind zum Beispiel Kleidung, Wohnraum und ein Fahrrad. Nichtmaterielle Güter sind etwa Vertrauen, Anerkennung oder Zeit miteinander. Beides kann zusammenhängen: Ein Fahrrad ist ein Gegenstand und ermöglicht gemeinsame Ausflüge. Geld kann helfen, wichtige Bedürfnisse zu erfüllen. Es kann Freundschaft jedoch nicht einfach kaufen. Deshalb sind „Geld macht immer glücklich“ und „Geld ist völlig unwichtig“ beide zu pauschal."], ["So begründest du ein Kriterium", "Schreibe nicht nur „Freundschaft“. Ergänze: „Verlässliche Freundschaften können zu einem glücklichen Leben beitragen, weil man Unterstützung bekommt und Erlebnisse teilen kann.“ Ein Grund erklärt den Zusammenhang."]], "lab": "garden"}, "wuensche-beduerfnisse": {"art": "choices", "sections": [["Was ich gern hätte – und was ich brauche", "Ein <b>Wunsch</b> richtet sich auf etwas, das wir gern hätten oder erleben würden. Ein <b>Bedürfnis</b> betrifft etwas für unser Wohlergehen Wichtiges, zum Beispiel Nahrung, Schutz, Zugehörigkeit oder Erholung. Wünsche können Bedürfnisse ausdrücken: Der Wunsch nach einem Treffen kann zum Bedürfnis nach Gemeinschaft gehören. Ein bestimmtes teures Markenprodukt ist dagegen nicht für alle notwendig."], ["Nicht vorschnell sortieren", "Ein Smartphone ist nicht in jeder Situation gleich wichtig. Es kann Unterhaltung sein, aber auch helfen, eine Bezugsperson zu erreichen. Untersuche deshalb den Zusammenhang: Wozu soll es dienen? Gibt es Alternativen? Eine begründete Einordnung ist hilfreicher als „Das braucht niemand“."], ["Wenn Vergleiche Druck machen", "In einer erfundenen Geschichte sieht Tom nur die Urlaubsbilder anderer und denkt: „Alle haben ein besseres Leben.“ Er kennt aber nur ausgewählte Ausschnitte. Aus einzelnen Bildern folgt nichts Sicheres über das ganze Leben. Ein sinnvoller Vergleich fragt auch nach eigenen Möglichkeiten, nicht nur nach Besitz oder Beliebtheit."], ["Eine eigene Prüfung", "Frage bei einem Wunsch: Welches Bedürfnis steckt dahinter? Wie wichtig ist er mir nach etwas Bedenkzeit? Wem könnte meine Entscheidung nutzen oder schaden? Du musst deine privaten Wünsche hier nicht verraten; erfundene Beispiele reichen."]], "lab": null}, "zukunftswuensche": {"art": "path", "sections": [["Zukunft ist mehr als ein Beruf", "„Später möchte ich Tiere versorgen.“ „Ich wünsche mir Zeit für Freunde.“ „Ich möchte sicher leben.“ Solche Sätze beschreiben Zukunftswünsche. Sie können Arbeit, Beziehungen, Freizeit oder Lebensbedingungen betreffen. Es ist völlig in Ordnung, mit zwölf Jahren noch keinen Berufswunsch zu haben."], ["Wunsch, Ziel und Schritt", "Ein Wunsch ist eine Vorstellung. Ein <b>Ziel</b> macht genauer, was du erreichen möchtest. Ein <b>Schritt</b> beschreibt, was du als Nächstes tun kannst. Beispiel: Wunsch: „Ich möchte musizieren.“ Ziel: „Ich kann in vier Wochen ein leichtes Stück spielen.“ Schritt: „Ich übe dienstags und freitags zehn Minuten und frage nach Hilfe.“ Ein Ziel sollte zu den eigenen Möglichkeiten passen."], ["Ein Plan bleibt veränderbar", "Manches kannst du beeinflussen, anderes nicht: Üben und Nachfragen sind eher beeinflussbar; eine plötzliche Erkrankung oder die Zahl freier Plätze kaum. Ein Plan mit Alternativen ist deshalb kein Zeichen von Schwäche. Auch Interessen dürfen sich ändern. Niemand kann dir Erfolg garantieren."], ["Fiktiver Blick nach vorn", "Stelle dir ein erfundenes Kind in fünf Jahren vor. Beschreibe nicht nur, was es besitzt, sondern auch Beziehungen, Tätigkeiten und Verantwortung. So entsteht eine begründete Vorstellung vom Leben statt einer reinen Wunschliste."]], "lab": "planner"}, "perspektiven": {"art": "bridge", "sections": [["Drei erfundene Stimmen", "<b>Lina, 12, Hannover:</b> „Ich möchte Spiele entwickeln und genug Zeit für meine Freunde haben.“ <b>Mateo, 12, Valparaíso:</b> „Ich möchte einen gemeinschaftlichen Garten gestalten. Ein ruhiger Lernplatz wäre mir wichtig.“ <b>Awa, 12, Dakar:</b> „Ich möchte Sportreporterin werden und wünsche mir, dass meine Familie gesund bleibt.“ Diese Personen und Aussagen sind vollständig erfunden. Sie sind keine Untersuchung und stehen nicht stellvertretend für ein Land."], ["Gemeinsamkeiten und Unterschiede", "Alle drei denken über Tätigkeiten nach, die ihnen etwas bedeuten. Ihre konkreten Wünsche unterscheiden sich. Manche Wünsche betreffen Interessen, andere Lebensbedingungen. Ein guter Vergleich nennt beides und verweist genau auf die Aussagen. Schreibe etwa: „Lina und Awa nennen eine berufliche Tätigkeit. Mateo nennt einen Lernplatz.“"], ["Kontext prüfen, nicht Menschen festlegen", "Familie, Geld, Schule, Sicherheit und kulturelle Erfahrungen können Möglichkeiten beeinflussen. Daraus folgt nicht, dass alle Kinder eines Landes gleich wünschen. Auch innerhalb einer Stadt oder Familie unterscheiden sich Wünsche. Geschlecht legt Interessen oder Berufe ebenfalls nicht fest. Frage nach der einzelnen Person, statt aus Herkunft oder Aussehen zu raten."], ["Eine faire Schlussfolgerung", "Trenne Beobachtung und Vermutung: „Mateo nennt einen ruhigen Lernplatz“ steht im Text. „Alle Kinder seines Landes haben keinen Lernplatz“ steht dort nicht. Bei einem unbekannten Wunsch ist eine offene Nachfrage besser als eine Unterstellung."]], "lab": null}, "vorbilder": {"art": "star", "sections": [["Warum Menschen uns beeindrucken", "Ein <b>Vorbild</b> ist jemand, an dessen Verhalten wir uns in einem bestimmten Punkt orientieren. Die Nachbarin, die geduldig hilft, kann ebenso Vorbild sein wie eine bekannte Sportlerin. Ein <b>Idol</b> wird besonders stark bewundert. Beide Begriffe können sich überschneiden; berühmt zu sein macht jemanden nicht automatisch zum guten Vorbild."], ["Eine Eigenschaft statt eines ganzen Menschen", "Du kannst Ausdauer bewundern, ohne jede Meinung der Person zu übernehmen. Prüfe konkret: Welches Verhalten finde ich gut? Warum? Welche Folgen hat es für andere? Ein Mensch kann in einer Hinsicht ein Vorbild sein und in einer anderen Fehler machen."], ["Ein erfundener Fall", "Ein bekannter Läufer setzt sich fair für einen Konkurrenten ein. Später wirbt er für ein unnötig teures Produkt. Fairness kann nachahmenswert sein; die Kaufempfehlung muss deshalb nicht sinnvoll sein. Bewunderung ersetzt kein eigenes Nachdenken."], ["Verbindung zum Glück", "Vorbilder können Ideen und Mut für eigene Ziele geben. Sie können aber auch unrealistische Maßstäbe erzeugen, wenn nur Siege oder perfekte Bilder zählen. Die hilfreiche Frage lautet: „Was passt zu meinen Werten und Möglichkeiten?“ und nicht: „Wie werde ich eine Kopie dieses Menschen?“"]], "lab": null}, "massstaebe": {"art": "steps", "sections": [["Erfolg braucht einen Bezugspunkt", "Ein Erfolg bedeutet, dass ein angestrebtes Ergebnis ganz oder teilweise erreicht wird. Aber welches Ziel und welcher Maßstab gelten? In einem Wettkampf zählt vielleicht der erste Platz. Für jemanden, der lange verletzt war, kann schon das sichere Mitmachen ein persönlicher Erfolg sein."], ["Relativer Erfolg", "<b>Relativ</b> heißt hier: im Verhältnis zu einem Ausgangspunkt oder Ziel. In einer erfundenen Lernaufgabe löst Emre erst drei, später sechs von zehn Aufgaben richtig. Er hat Fortschritte gemacht, auch wenn noch nicht alles klappt. Eine ehrliche Einschätzung kann beides sagen: „Das ist besser geworden; an diesem Teil arbeite ich weiter.“"], ["Erwartungen erkennen", "Eigene Erwartungen kommen von dir selbst. Fremde Erwartungen kommen etwa von Familie, Team oder Mitschülerinnen. Sie können helfen oder Druck machen. „Ich muss jedes Mal der Beste sein“ kann überzogen sein. Ein einzelnes Ergebnis beschreibt außerdem nicht den Wert eines Menschen."], ["Erfolg und Glück sind nicht dasselbe", "Ein Sieg kann Freude auslösen. Jemand kann trotzdem einsam sein oder großen Druck erleben. Umgekehrt kann ein Mensch trotz eines verlorenen Spiels Spaß und Gemeinschaft erfahren. Prüfe daher, ob von einem Ergebnis, einem Gefühl oder einem ganzen Leben gesprochen wird."]], "lab": null}, "einfluss": {"art": "weather", "sections": [["Mehrere Ursachen statt einer Schuldformel", "Übung, Vorbereitung und Ausdauer können helfen. Für ein Ergebnis spielen aber auch Unterstützung, passende Materialien, Gesundheit, Zeit und Zufall eine Rolle. Deshalb folgt aus einem Misserfolg nicht automatisch „Du warst faul“. Umgekehrt ist Erfolg kein sicherer Beweis, dass jemand mehr wert ist oder mehr geleistet hat als alle anderen."], ["Der eigene Einfluss hat Grenzen", "Du kannst dir eine Übungszeit vornehmen und um Hilfe bitten. Ob du genau am Prüfungstag krank wirst, kannst du nicht einfach bestimmen. Manche Dinge sind teilweise beeinflussbar: Eine Lerngruppe braucht die Bereitschaft mehrerer Menschen. Mit dieser Unterscheidung kannst du planen, ohne dir für alles die Schuld zu geben."], ["Chancen mitdenken", "Zwei Kinder bereiten ein Referat vor. Eines hat Ruhe, Material und Unterstützung; das andere teilt einen lauten Raum und muss erst Bücher ausleihen. Beide können sich anstrengen, haben aber unterschiedliche Bedingungen. Eine faire Einschätzung berücksichtigt das. Hilfe kann Chancen verbessern, zum Beispiel ein schulischer Arbeitsraum."], ["Nicht in die andere Richtung übertreiben", "„Alles ist nur Zufall“ ist ebenso ungenau wie „Alles liegt an dir“. Frage: Was hat vermutlich mitgewirkt? Welche Information fehlt? Welcher nächste Schritt liegt in meinem Einfluss? So wird aus einer pauschalen Bewertung eine nachvollziehbare Erklärung."]], "lab": "influence"}, "rueckschlaege": {"art": "support", "sections": [["Erst wahrnehmen, dann planen", "Nach einem Rückschlag darfst du enttäuscht oder wütend sein. Ein hilfreicher erster Schritt kann sein, eine Pause zu machen und Gefühle zu benennen. „Ich bin enttäuscht“ ist etwas anderes als „Ich bin ein Versager“. Die erste Aussage beschreibt ein Gefühl, die zweite macht aus einem Ergebnis ein hartes Gesamturteil."], ["Ein möglicher Weg", "Nimm dir Zeit. Kläre danach: Was genau ist passiert? Was lief schon gut? Was kann ich beeinflussen? Suche einen überschaubaren nächsten Schritt und Unterstützung. Diese Reihenfolge ist eine Lernhilfe, keine Pflicht für jede Situation. Manchmal ist Zuhören zunächst wichtiger als ein Plan."], ["Trost ist nicht Wegreden", "„Stell dich nicht so an“ nimmt das Gefühl nicht ernst. „Ich sehe, dass du enttäuscht bist. Möchtest du erzählen?“ lässt der Person Raum. Hilfe zu suchen kann vernünftig sein. Bei einem Erfolg kannst du dich freuen und andere anerkennen, ohne sie kleinzumachen. Bescheidenheit bedeutet dabei nicht, den eigenen Erfolg leugnen zu müssen."], ["Was du üben kannst", "Bewerte einen konkreten Schritt: „Beim nächsten Mal lese ich die Aufgaben genauer.“ Hole dir Rückmeldung, die sagt, was du verändern kannst. Wenn ein Ziel gerade nicht erreichbar ist, darf es angepasst werden. Kein Lerntrick garantiert dauernd gute Gefühle."]], "lab": null}, "verantwortung-planen": {"art": "community", "sections": [["Verantwortung ist mehr als ein gutes Gefühl", "<b>Verantwortungsbewusstsein</b> heißt hier: Die vorhersehbaren Folgen des eigenen Handelns beachten, andere mitdenken und für das eigene Handeln einstehen. Du bist nicht für alles verantwortlich, was auf der Welt geschieht. Du kannst aber im eigenen Einflussbereich mitgestalten."], ["Eine Entscheidung mit mehreren Perspektiven", "Die Klasse plant ein Fest. Lautes Feiern macht einigen Spaß; andere brauchen Ruhe oder einen zugänglichen Raum. Verantwortlich planen heißt, Beteiligte anzuhören, Möglichkeiten zu vergleichen und eine faire Lösung zu suchen. Das kann getrennte Bereiche, angemessene Lautstärke und gemeinsame Absprachen bedeuten."], ["Umwelt als Lebensbedingung", "Sauberes Wasser, Luft und ein sorgsamer Umgang mit Lebensräumen sind mögliche Bedingungen eines guten Lebens. Daraus lässt sich eine konkrete Handlung ableiten: Bei einem Fest Mehrweg nutzen und Müll vermeiden. Prüfe, ob eine Maßnahme vor Ort sinnvoll und machbar ist. Ein einzelnes Kind kann große Umweltprobleme nicht allein lösen; gemeinsame Regeln und Entscheidungen sind ebenfalls wichtig."], ["Vier Fragen für einen Plan", "Was ist das Ziel? Wer ist betroffen? Welche Folgen und Alternativen gibt es? Wer übernimmt welchen machbaren Schritt? Ergänze einen Zeitpunkt zum Überprüfen. Dann wird aus „Wir sollten etwas tun“ ein verantwortlicher Vorschlag."]], "lab": "decision"}, "begruenden": {"art": "balance", "sections": [["Eine Meinung ist ein Anfang", "„Geld allein reicht nicht für ein glückliches Leben“ ist eine Behauptung. Damit andere sie prüfen können, brauchst du Gründe. Ein Beispiel kann einen Grund verdeutlichen, ersetzt ihn aber nicht. Gute Argumente beziehen sich auf die Frage, beachten die Situation und werten Menschen nicht ab."], ["Behauptung – Grund – Beispiel", "Behauptung: „Verlässliche Beziehungen können wichtig sein.“ Grund: „Sie können Unterstützung in schwierigen Situationen geben.“ Beispiel: „Ein Freund hört nach einer Enttäuschung zu.“ Daraus folgt keine Garantie, dass jede Beziehung glücklich macht. Formulierungen wie „kann“, „oft“ oder „unter diesen Bedingungen“ helfen, genauer zu sein."], ["Einwände ernst nehmen", "Zur Aussage „Ein teures Geschenk macht glücklich“ kannst du einen Einwand prüfen: Es kann Freude machen, aber fehlendes Vertrauen nicht einfach ersetzen. Ein abgewogenes Urteil berücksichtigt beide Seiten: „Ein Geschenk kann schön sein; auf Dauer sind außerdem verlässliche Beziehungen wichtig.“ Eine begründete andere Einschätzung darf diskutiert werden."], ["Was in offenen Aufgaben zählt", "Bewertet werden hier nachvollziehbare Gründe, passende Beispiele, Bezug zur Aufgabe und das Beachten anderer Perspektiven. Niemand bekommt Punkte dafür, eine vorgeschriebene private Glücksvorstellung zu haben. Benutze bei persönlichen Fragen gern erfundene Personen."]], "lab": null}, "pruefungswerkzeug": {"art": "notebook", "sections": [["Was die Aufgabenwörter verlangen", "<b>Benennen:</b> passende Begriffe oder Beispiele aufzählen. <b>Beschreiben:</b> einen Sachverhalt geordnet in eigenen Worten darstellen. <b>Vergleichen:</b> Gemeinsamkeiten und Unterschiede zeigen. <b>Begründen:</b> nachvollziehbare Gründe für eine Aussage geben. <b>Beurteilen:</b> anhand von Gesichtspunkten zu einem begründeten Urteil kommen. <b>Entwickeln:</b> einen passenden eigenen Vorschlag ausarbeiten."], ["Ein Fall ist kein Ratespiel", "Lies zuerst: Wer handelt? Was ist passiert? Was weiß ich sicher? Was nur vermutlich? Markiere die eigentliche Frage. Wenn eine Figur traurig ist, kennst du noch nicht alle Ursachen. Bleibe bei den Informationen und kennzeichne Vermutungen."], ["Ein kurzer Antwortplan", "Bei einer Beurteilung kannst du so vorgehen: Nenne die strittige Aussage. Prüfe mindestens zwei relevante Gesichtspunkte. Beziehe sie auf den Fall. Formuliere ein begründetes Ergebnis oder eine begründete Bedingung. Die Anzahl der Sätze allein entscheidet nicht über die Qualität."], ["Dein Weg zum Abschluss", "Nutze erst die vier Prüfungsmodule mit getrennten Ergebnissen. In der Gesamtabfrage mischen sich alle Themen. Die Probeklausur verlangt zusätzlich längere Fallantworten und hat 60 Punkte. Bei offenen Antworten gibt es Beispielantworten mit Punkthinweisen zur Selbsteinschätzung, keine automatische Benotung deiner Meinung. Alle Prüfungen sind eigene Übungsentwürfe, keine amtlichen Klassenarbeiten."]], "lab": null}};render(false);}catch(err){main.innerHTML='<div class="error-box"><h1>Die Lernwelt konnte nicht starten.</h1><p>'+esc(err.message)+'</p></div>';}
