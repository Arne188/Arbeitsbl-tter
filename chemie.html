            "answer": [

function collideParticles(particles){

function saveView(){const s=stats();return `${bread([['Sichern & Laden']])}${intro('Dein Fortschritt gehört dir','Heute lernen. Morgen weitermachen.','Im selben Browser bleibt dein Lernstand automatisch erhalten. Mit einer Sicherungsdatei kannst du ihn auch auf einem anderen Gerät oder in einem anderen Browser laden.')}<div class="settings-grid"><section class="paper"><h2>↥ Lernstand sichern</h2><p>Lade eine kleine JSON-Datei mit Antworten, Zeichnungen, Fortschritt und beiden Prüfungen herunter. Hebe sie auf oder übertrage sie auf dein anderes Gerät.</p><p><strong>${s.done} bearbeitete Aufgaben</strong><br/>${state.updated?'Zuletzt gespeichert: '+new Date(state.updated).toLocaleString('de-DE'):'Du kannst jederzeit die erste Sicherung anlegen.'}</p><div class="button-row"><button class="button" data-action="export">Sicherung herunterladen</button></div></section><section class="paper"><h2>↧ Lernstand laden</h2><p>Wähle eine zuvor gespeicherte Sicherungsdatei der Chemie-Lernwelt. Biologie-Lernstände werden getrennt gespeichert und gehören zu einer anderen Lernseite. Nach deiner Bestätigung ersetzt sie den aktuellen Stand.</p><p>Die Datei wird direkt in diesem Browser gelesen. Sie wird nicht hochgeladen.</p><div class="button-row"><button class="button secondary" data-action="import">Sicherungsdatei auswählen</button></div></section><section class="paper full-width"><h2>🔒 So wird gespeichert</h2><p>Die automatische Speicherung gilt nur für dieses Gerät, diesen Browser und diese Webseitenadresse. Im privaten Modus oder nach dem Löschen der Browserdaten kann sie verloren gehen. Es gibt keine Anmeldung, keine Cloud-Synchronisation und keine Übertragung deiner Antworten an einen Server.</p>${!storageOK?'<div class="callout warning">Dein Browser erlaubt gerade kein zuverlässiges automatisches Speichern. Nutze bitte den Datei-Export.</div>':''}<div class="button-row"><button class="button secondary" data-action="reset-exam" data-scope="general">Nur Vertiefungs-Probeklausur zurücksetzen</button><button class="button secondary" data-action="reset-exam" data-scope="preparation">Nur passendes Prüfungstraining zurücksetzen</button><button class="button secondary" data-action="reset-all">Gesamten Lernstand zurücksetzen</button></div></section></div>`;}

function aboutView(){return `${bread([['Über die Lernwelt']])}${intro('Unsichtbares verständlich machen','Über Chemie-Entdecker','Teilchenmodell und seine Anwendungen für Chemie Klasse 6.')}<div class="paper reading"><h2>Was wurde nachgeschlagen?</h2><p>Im niedersächsischen Kerncurriculum für das Gymnasium stehen im Doppeljahrgang 5/6 das Teilchenmodell, Aggregatzustände und Diffusion auf Stoff- und Teilchenebene. Dazu gehören auch Stoffe und Körper, Reinstoffe, Gemische und Trennverfahren. Diese Seite konzentriert sich auf das Teilchenmodell und passende Anwendungen. Am 11. November 2026 wurde der Kurs mit den bereitgestellten Lösungen und dem Erwartungshorizont abgeglichen. Die Prüfungsvorbereitung führt gezielt zu diesen Lernzielen; Trennverfahren bleiben zusätzliche Vertiefung. Die Reihenfolge im Unterricht legt die Schule fest.</p><h2>Was zeigt das Modell?</h2><p>Farben unterscheiden Modellbausteine. Kugelgrößen, Abstände und Zeitabläufe sind nicht maßstabsgetreu. Die Animation ist qualitativ und simuliert keine echte Temperaturmessung. Das Innere von Atomen wird hier noch nicht behandelt. Eigenschaften wie die besondere Ausdehnung von Wasser beim Gefrieren werden vom einfachen Bild nicht genau erklärt.</p><h2>Wie wird geübt?</h2><p>Auswahlfragen, Bildzuordnungen und Reihenfolgen werden automatisch geprüft. Freie Antworten und eigene Teilchenbilder vergleichst du mit Musterlösungen und schätzt die passenden Punkte selbst ein. Automatische und selbst eingeschätzte Punkte werden getrennt gezeigt. Es wird weder eine automatische Sprach- noch eine automatische Zeichnungsbewertung behauptet. „Bearbeitet“ bedeutet nicht automatisch sicher beherrscht.</p><h2>Abgleich mit der Prüfungsvorbereitung</h2><p>Grundlage: die privat bereitgestellte Datei „04_Loesungen_und_Erwartungshorizont.pdf“, insbesondere die zehn Übungen und fünf Aufgabenbereiche der Übungsklassenarbeit. Diese Datei enthält Lösungen; neue Lernaufgaben wurden eigenständig formuliert. Die PDF und Namen beziehungsweise Schulkennzeichen werden nicht veröffentlicht. Neu: selektive Trennwand, Herauslösen gegenüber Diffusion, Erwärmen in starren und nachgiebigen Behältern, Gasdruck, homogene/heterogene Gemische, Zutatenlisten und eigene Modellzeichnungen.</p><h2>Quellen</h2><ul class="source-list"><li><a href="https://cuvo.nibis.de/index.php?p=download&amp;upload=18" target="_blank" rel="noopener">Niedersächsisches Kultusministerium: Kerncurriculum Gymnasium 5–10, Naturwissenschaften, Teil Chemie, gedruckte Seiten 51–52</a></li><li><a href="https://bildungsportal-niedersachsen.de/unterricht-mehr/unterrichtsfaecher/chemie" target="_blank" rel="noopener">Bildungsportal Niedersachsen: Chemie und geltende curriculare Vorgaben</a></li><li><a href="https://www.fkg-goettingen.de/schulorganisation/fachbereiche/chemie/sekundarstude-i/" target="_blank" rel="noopener">Felix-Klein-Gymnasium Göttingen: Umsetzung für die Jahrgänge 5/6</a></li></ul><p>Curriculare Einordnung geprüft am 28. Oktober 2026. Die Aufgaben und Modelle wurden eigens erstellt. Rechen- und Modellzahlen sind Übungsbeispiele. Diese Seite erklärt Verfahren, ersetzt aber keine Sicherheitsanleitung für reale Experimente.</p><h2>Dein Lernstand</h2><p>Antworten bleiben in diesem Browser. Unter „Sichern &amp; Laden“ kannst du sie als Datei sichern und auf einem anderen Gerät laden. Es gibt keine Anmeldung, keine Analyse- oder Werbedienste und keine Übertragung deiner Antworten an einen Server. Die Seite lädt keine externen Schriften. Bei lokalen Dateien kann die automatische Speicherung je nach Browser eingeschränkt sein; nutze dann eine Sicherungsdatei.</p><a class="button" href="#/">Zur Lernübersicht →</a></div>`;}

        "html": "<b>Diffusion</b> ist die Durchmischung von Teilchen durch ihre ungeordnete Eigenbewegung. Wenn anfangs auf einer Seite viele Teilchen einer Sorte liegen, kann ihre Verteilung im Mittel gleichmäßiger werden. Die Teilchen suchen dabei kein Ziel."

        "type": "heading",
